<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atlas Core logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- edges: a small constellation of meaning -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round">
    <line x1="70" y1="98" x2="104" y2="66"/>
    <line x1="70" y1="98" x2="122" y2="124"/>
    <line x1="104" y1="66" x2="122" y2="124"/>
    <line x1="122" y1="124" x2="98" y2="172"/>
    <line x1="122" y1="124" x2="172" y2="90"/>
    <line x1="122" y1="124" x2="184" y2="152"/>
    <line x1="172" y1="90" x2="184" y2="152"/>
    <line x1="184" y1="152" x2="150" y2="188"/>
    <line x1="98" y1="172" x2="150" y2="188"/>
  </g>
  <!-- center/query node: accent + glow -->
  <circle cx="122" cy="124" r="34" fill="url(#glow)"/>
  <g fill="#FFFFFF">
    <circle cx="70" cy="98" r="7"/>
    <circle cx="104" cy="66" r="6"/>
    <circle cx="98" cy="172" r="6"/>
    <circle cx="172" cy="90" r="7"/>
    <circle cx="184" cy="152" r="6"/>
