<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atlas Core — map any data by meaning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#141B34"/>
    </linearGradient>
    <linearGradient id="tile" x1="96" y1="110" x2="300" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="word" x1="360" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <!-- faint node field, right side -->
  <g stroke="#6366F1" stroke-opacity="0.18" stroke-width="2">
    <line x1="980" y1="90" x2="1080" y2="140"/><line x1="1080" y1="140" x2="1180" y2="96"/>
    <line x1="1080" y1="140" x2="1120" y2="250"/><line x1="1120" y1="250" x2="1040" y2="320"/>
    <line x1="1120" y1="250" x2="1210" y2="300"/>
  </g>
  <g fill="#6366F1" fill-opacity="0.35">
    <circle cx="980" cy="90" r="5"/><circle cx="1180" cy="96" r="5"/><circle cx="1040" cy="320" r="5"/><circle cx="1210" cy="300" r="5"/>
  </g>
  <circle cx="1120" cy="250" r="7" fill="#22D3EE" fill-opacity="0.7"/>
  <circle cx="1080" cy="140" r="7" fill="#A78BFA" fill-opacity="0.7"/>

  <!-- logo tile -->
  <g transform="translate(96,110)">
    <rect width="204" height="204" rx="46" fill="url(#tile)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" transform="scale(0.8)">
      <line x1="70" y1="98" x2="104" y2="66"/><line x1="70" y1="98" x2="122" y2="124"/>
      <line x1="104" y1="66" x2="122" y2="124"/><line x1="122" y1="124" x2="98" y2="172"/>
      <line x1="122" y1="124" x2="172" y2="90"/><line x1="122" y1="124" x2="184" y2="152"/>
      <line x1="172" y1="90" x2="184" y2="152"/><line x1="184" y1="152" x2="150" y2="188"/>
      <line x1="98" y1="172" x2="150" y2="188"/>
    </g>
    <g fill="#FFFFFF" transform="scale(0.8)">
      <circle cx="70" cy="98" r="7"/><circle cx="104" cy="66" r="6"/><circle cx="98" cy="172" r="6"/>
      <circle cx="172" cy="90" r="7"/><circle cx="184" cy="152" r="6"/><circle cx="150" cy="188" r="5"/>
    </g>
    <circle cx="97.6" cy="99.2" r="26" fill="url(#glow)"/>
    <circle cx="97.6" cy="99.2" r="10" fill="#22D3EE" stroke="#FFFFFF" stroke-width="2.6"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="195" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#word)">Atlas Core</text>
  <text x="362" y="248" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#8B93B8">Map any data by meaning.</text>
  <!-- feature chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600">
    <g transform="translate(362,286)"><rect width="150" height="40" rx="20" fill="#1E2746"/><text x="20" y="26" fill="#A5B4FC">embed</text></g>
    <g transform="translate(524,286)"><rect width="150" height="40" rx="20" fill="#1E2746"/><text x="20" y="26" fill="#A5B4FC">cluster</text></g>
    <g transform="translate(686,286)"><rect width="150" height="40" rx="20" fill="#1E2746"/><text x="20" y="26" fill="#A5B4FC">narrate</text></g>
    <g transform="translate(848,286)"><rect width="150" height="40" rx="20" fill="#1E2746"/><text x="20" y="26" fill="#67E8F9">search</text></g>
  </g>
</svg>
