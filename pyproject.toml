[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-core"
version = "0.1.0"
description = "Domain-agnostic semantic knowledge map: ingest any content, then embed, cluster into topics, summarize, narrate, and search by meaning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["embeddings", "semantic-search", "knowledge-graph", "clustering", "rag", "multilingual"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.2"]
bedrock = ["boto3>=1.34"]
openai = ["openai>=1.0"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
mssql = ["pymssql>=2.2"]
langchain = ["langchain-core>=0.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["atlas_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
